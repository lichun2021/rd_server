# 合并的区服第一个为主区, dbNames必须是多个, dbHosts(port,password)可以不为多个, 当为一个时表示所有的数据库的用户名密码等都一样
dbNames=game_10001,game_10002,game_10003,game_10004

#hosts（与 dbNames 一一对应）
dbHosts=192.168.10.85,192.168.10.85,192.168.10.226,192.168.10.226

#port
dbPorts=3306,3306,3306,3306

#username 用户名
dbUsernames=remote_user,remote_user,remote_user,remote_user

#passwords 密码.
dbPasswords=SecurePass123,SecurePass123,SecurePass123,SecurePass123